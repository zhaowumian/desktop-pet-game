<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>桌面抓宠小游戏</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      width: 100vw;
      height: 100vh;
      overflow: hidden;
      background: transparent;
      font-family: 'Microsoft YaHei', sans-serif;
      cursor: default;
    }

    #game-container {
      width: 100%;
      height: 100%;
      position: relative;
    }

    .pet {
      position: absolute;
      width: 64px;
      height: 64px;
      cursor: grab;
      user-select: none;
      z-index: 1000;
      transition: transform 0.1s;
      filter: drop-shadow(2px 2px 4px rgba(0,0,0,0.3));
    }

    .pet svg {
      width: 100%;
      height: 100%;
      pointer-events: none;
    }

    .pet.caught {
      cursor: grabbing;
      z-index: 1001;
      transform: scale(1.2);
      filter: drop-shadow(4px 4px 8px rgba(0,0,0,0.5));
    }

    .pet.fleeing svg {
      animation: fleeWobble 0.12s infinite alternate;
    }

    .pet.fleeing::after {
      content: '💨';
      position: absolute;
      top: -8px;
      right: -10px;
      font-size: 20px;
      pointer-events: none;
    }

    @keyframes fleeWobble {
      0% { transform: rotate(-7deg) scale(1.08); }
      100% { transform: rotate(7deg) scale(1.08); }
    }

    .pet:hover {
      transform: scale(1.1);
    }

    .recycle-bin {
      position: absolute;
      bottom: 20px;
      right: 20px;
      width: 80px;
      height: 80px;
      background: rgba(200, 200, 200, 0.8);
      border: 3px dashed #666;
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 40px;
      z-index: 999;
      transition: all 0.3s;
    }

    .recycle-bin:hover {
      background: rgba(150, 150, 150, 0.9);
      transform: scale(1.1);
    }

    .recycle-bin.drag-over {
      background: rgba(255, 100, 100, 0.9);
      border-color: #ff0000;
      transform: scale(1.2);
      animation: pulse 0.5s infinite;
    }

    @keyframes pulse {
      0%, 100% { transform: scale(1.2); }
      50% { transform: scale(1.3); }
    }

    .score-board {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(0, 0, 0, 0.6);
      color: white;
      padding: 10px 20px;
      border-radius: 20px;
      font-size: 18px;
      z-index: 999;
    }

    .hint {
      position: absolute;
      top: 60px;
      left: 20px;
      background: rgba(0, 0, 0, 0.4);
      color: white;
      padding: 5px 15px;
      border-radius: 15px;
      font-size: 12px;
      z-index: 999;
    }

    .exit-btn {
      position: absolute;
      top: 20px;
      right: 20px;
      width: 36px;
      height: 36px;
      background: rgba(220, 53, 69, 0.85);
      color: white;
      border: none;
      border-radius: 50%;
      font-size: 18px;
      cursor: pointer;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .exit-btn:hover {
      background: rgba(200, 35, 50, 1);
      transform: scale(1.15);
    }

    .summon-btn {
      position: absolute;
      top: 20px;
      right: 66px;
      height: 36px;
      padding: 0 14px;
      background: rgba(40, 167, 69, 0.85);
      color: white;
      border: none;
      border-radius: 18px;
      font-size: 14px;
      cursor: pointer;
      z-index: 2000;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: all 0.2s;
    }

    .summon-btn:hover {
      background: rgba(30, 147, 49, 1);
      transform: scale(1.05);
    }

    .spawn-notification {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      background: rgba(0, 0, 0, 0.8);
      color: white;
      padding: 20px 40px;
      border-radius: 15px;
      font-size: 24px;
      z-index: 2000;
      animation: fadeInOut 2s forwards;
      pointer-events: none;
    }

    @keyframes fadeInOut {
      0% { opacity: 0; transform: translate(-50%, -50%) scale(0.5); }
      50% { opacity: 1; transform: translate(-50%, -50%) scale(1.1); }
      100% { opacity: 0; transform: translate(-50%, -50%) scale(1); }
    }

    .catch-effect {
      position: absolute;
      pointer-events: none;
      font-size: 30px;
      animation: catchAnim 0.5s forwards;
      z-index: 2001;
    }

    @keyframes catchAnim {
      0% { opacity: 1; transform: scale(1); }
      100% { opacity: 0; transform: scale(2); }
    }

    /* 宠物说话气泡（作为 .pet 子元素，随宠物一起移动） */
    .speech-bubble {
      position: absolute;
      bottom: 100%;
      left: 50%;
      transform: translateX(-50%);
      margin-bottom: 10px;
      background: rgba(255, 255, 255, 0.95);
      color: #333;
      padding: 7px 12px;
      border-radius: 12px;
      font-size: 13px;
      line-height: 1.4;
      white-space: nowrap;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.25);
      pointer-events: none;
      animation: bubblePop 0.25s ease-out, bubbleFade 0.5s ease-in 5.5s forwards;
      z-index: 1002;
    }

    .speech-bubble::after {
      content: '';
      position: absolute;
      top: 100%;
      left: 50%;
      transform: translateX(-50%);
      border: 6px solid transparent;
      border-top-color: rgba(255, 255, 255, 0.95);
    }

    @keyframes bubblePop {
      0% { opacity: 0; transform: translateX(-50%) scale(0.6); }
      100% { opacity: 1; transform: translateX(-50%) scale(1); }
    }

    @keyframes bubbleFade {
      to { opacity: 0; }
    }
  </style>
</head>
<body>
  <div id="game-container">
    <div class="score-board">
      已捕捉: <span id="score">0</span> 只
    </div>
    <div class="hint">
      宠物会逃离鼠标，快速点击抓住，拖到回收站消除
    </div>
    <button class="exit-btn" id="exitBtn" title="退出游戏">✕</button>
    <button class="summon-btn" id="summonBtn" title="立即召唤宠物">召唤宠物</button>
    <div class="recycle-bin" id="recycleBin">
      🗑️
    </div>
  </div>

      if (caughtPetId !== null) {
        if (!isAcceptingMouseEvents) {
          isAcceptingMouseEvents = true;
          ipcRenderer.send('set-ignore-mouse-events', false);
        }
        return;
      }
      const target = document.elementFromPoint(x, y);
      const isInteractive = target && (
        target.closest('.pet') ||
        target.closest('.recycle-bin') ||
        target.closest('.exit-btn') ||
        target.closest('.summon-btn') ||
        target.closest('.score-board') ||
        target.closest('.hint')
      );

      if (isInteractive && !isAcceptingMouseEvents) {
        isAcceptingMouseEvents = true;
        ipcRenderer.send('set-ignore-mouse-events', false);
      } else if (!isInteractive && isAcceptingMouseEvents) {
        isAcceptingMouseEvents = false;
        ipcRenderer.send('set-ignore-mouse-events', true);
      }
    }

    // 退出按钮
    exitBtn.addEventListener('click', () => {
      ipcRenderer.send('app-quit');
    });

    // 监听宠物生成
    ipcRenderer.on('pet-spawned', (event, pet) => {
      createPetElement(pet);
      showNotification(`一只野生的 ${pet.type} 出现了！`);
    });

    // 监听宠物移动更新
    ipcRenderer.on('pets-moved', (event, updatedPets) => {
      updatedPets.forEach(pet => {
        const element = pets.get(pet.id);
        if (!element) return;
        // 切换逃跑状态样式
        element.classList.toggle('fleeing', !!pet.fleeing && !pet.isCaught);
        if (!pet.isCaught) {
          element.style.left = pet.x + 'px';
          element.style.top = pet.y + 'px';
        }
      });
    });

    // 监听捕捉确认
    ipcRenderer.on('pet-caught-confirmed', (event, petId) => {
      const element = pets.get(petId);
      if (element) {
        element.classList.add('caught');
        element.classList.remove('fleeing');
      }
    });

    // 监听宠物移除
    ipcRenderer.on('pet-removed', (event, petId) => {
      const element = pets.get(petId);
      if (element) {
        element.remove();
        pets.delete(petId);
        score++;
        scoreElement.textContent = score;
      }
    });

    // 创建宠物DOM元素
    function createPetElement(pet) {
      const element = document.createElement('div');
      element.className = 'pet';
      element.innerHTML = PET_SVGS[pet.type] || pet.emoji;
      element.style.left = pet.x + 'px';
      element.style.top = pet.y + 'px';
      element.dataset.id = pet.id;
      element.title = pet.type;

      // 鼠标按下事件
      element.addEventListener('mousedown', (e) => {
        if (e.button === 0) { // 左键
          caughtPetId = pet.id;
          const rect = element.getBoundingClientRect();
          dragOffset.x = e.clientX - rect.left;
          dragOffset.y = e.clientY - rect.top;
          
          // 通知主进程宠物被抓住
          ipcRenderer.send('pet-caught', pet.id);
          
          // 显示捕捉特效
          showCatchEffect(e.clientX, e.clientY);
        }
      });

      gameContainer.appendChild(element);
      pets.set(pet.id, element);
    }

    // 显示通知
    function showNotification(text) {
      const notification = document.createElement('div');
      notification.className = 'spawn-notification';
      notification.textContent = text;
      gameContainer.appendChild(notification);
      
      setTimeout(() => {
        notification.remove();
      }, 2000);
    }

    // 显示捕捉特效
    function showCatchEffect(x, y) {
      const effect = document.createElement('div');
      effect.className = 'catch-effect';
      effect.textContent = '✨';
      effect.style.left = x + 'px';
      effect.style.top = y + 'px';
      gameContainer.appendChild(effect);
      
      setTimeout(() => {
        effect.remove();
      }, 500);
    }

    // 全局鼠标移动事件
    document.addEventListener('mousemove', (e) => {
      // 检查是否需要切换鼠标穿透状态
      updateMousePassthrough(e.clientX, e.clientY);

      // 节流上报鼠标位置（约每40ms），供主进程计算宠物逃跑
      const now = Date.now();
      if (now - lastMouseReport > 40) {
        lastMouseReport = now;
        ipcRenderer.send('mouse-position', { x: e.clientX, y: e.clientY });
      }

      if (caughtPetId !== null) {
        const element = pets.get(caughtPetId);
        if (element) {
          const x = e.clientX - dragOffset.x;
          const y = e.clientY - dragOffset.y;
          element.style.left = x + 'px';
          element.style.top = y + 'px';

          // 检查是否在回收站上方
          const binRect = recycleBin.getBoundingClientRect();
          const petRect = element.getBoundingClientRect();
          
          const isOverBin = 
            petRect.left < binRect.right &&
            petRect.right > binRect.left &&
            petRect.top < binRect.bottom &&
            petRect.bottom > binRect.top;

          if (isOverBin) {
            recycleBin.classList.add('drag-over');
          } else {
            recycleBin.classList.remove('drag-over');
          }
        }
      }
    });

    // 全局鼠标释放事件
    document.addEventListener('mouseup', (e) => {
      if (caughtPetId !== null && e.button === 0) {
        const element = pets.get(caughtPetId);
        const binRect = recycleBin.getBoundingClientRect();
        const petRect = element.getBoundingClientRect();
        
        // 检查是否放入回收站
        const isOverBin = 
          petRect.left < binRect.right &&
          petRect.right > binRect.left &&
          petRect.top < binRect.bottom &&
          petRect.bottom > binRect.top;

        if (isOverBin) {
          // 回收宠物
          ipcRenderer.send('pet-recycled', caughtPetId);
          showNotification('宠物已回收！+1分');
        } else {
          // 释放宠物
          ipcRenderer.send('pet-released', caughtPetId);
          element.classList.remove('caught');
        }

        recycleBin.classList.remove('drag-over');
        caughtPetId = null;
        // 释放后恢复穿透状态
        isAcceptingMouseEvents = false;
        ipcRenderer.send('set-ignore-mouse-events', true);
      }
    });

    // 阻止右键菜单
    document.addEventListener('contextmenu', (e) => {
      e.preventDefault();
    });

    // 防止拖拽时选中文本
    document.addEventListener('selectstart', (e) => {
      e.preventDefault();
    });

    // ===== 宠物定时打招呼（每隔1-3分钟，内容含当前时间） =====
    const GREETING_POOLS = {
      // 5-8点
      dawn: [
        '早上好呀～现在 {time}，新的一天开始啦！',
        '{time} 啦，早起的宠物有虫吃～',
        '早安！已经 {time} 咯，今天也要元气满满！',
        '清晨好～现在 {time}，空气真新鲜！'
      ],
      // 9-11点
      morning: [
        '上午好呀！现在 {time}，工作还顺利吗？',
        '哈喽～{time} 了，记得起来活动一下哦！',
        '{time} 好！抓不到我吧，嘿嘿～',
        '上午好！现在是 {time}，喝口水休息下吧～'
      ],
      // 11-13点
      noon: [
        '中午好！{time} 啦，该吃午饭咯～',
        '哈喽～现在 {time}，肚子有点饿了呢',
        '{time} 了，吃完饭记得午休一会儿哦！',
        '午安！{time}，今天中午吃什么呀？'
      ],
      // 14-17点
      afternoon: [
        '下午好呀～现在 {time}',
        '{time} 啦，下午茶时间到！',
        '嗨～{time} 了，下午也要加油哦！',
        '现在 {time}，困不困呀？起来走走吧～'
      ],
      // 18-22点
      evening: [
        '晚上好！{time} 啦，今天辛苦啦～',
        '哈喽～现在 {time}，吃晚饭了吗？',
        '{time} 了，晚上有什么安排呀？',
        '晚上好呀～{time}，陪我玩一会儿吧！'
      ],
      // 23-4点
      night: [
        '夜深了，现在 {time}，早点休息哦～',
        '{time} 啦，还没睡吗？注意身体呀',
        '晚安～已经 {time} 了，我也要困了',
        '现在 {time}，熬夜对身体不好哦～'
      ]
    };

    // 根据当前小时返回问候语池
    function getGreetingPool() {
      const h = new Date().getHours();
      if (h >= 5 && h < 9) return GREETING_POOLS.dawn;
      if (h >= 9 && h < 11) return GREETING_POOLS.morning;
      if (h >= 11 && h < 14) return GREETING_POOLS.noon;
      if (h >= 14 && h < 18) return GREETING_POOLS.afternoon;
      if (h >= 18 && h < 23) return GREETING_POOLS.evening;
      return GREETING_POOLS.night;
    }

    // 格式化当前时间 HH:MM
    function formatNow() {
      const d = new Date();
      return `${String(d.getHours()).padStart(2, '0')}:${String(d.getMinutes()).padStart(2, '0')}`;
    }

    // 随机挑一只未被抓住、且没在说话的宠物显示气泡
    function petSpeak() {
      const candidates = [];
      pets.forEach((element, id) => {
        if (!element.classList.contains('caught') &&
            !element.querySelector('.speech-bubble')) {
          candidates.push({ id, element, type: element.title });
        }
      });

      if (candidates.length > 0) {
        const target = candidates[Math.floor(Math.random() * candidates.length)];
        const pool = getGreetingPool();
        let text = pool[Math.floor(Math.random() * pool.length)].replace('{time}', formatNow());
        // 约一半概率带上宠物自称
        if (Math.random() < 0.5) {
          text = `${target.type}：${text}`;
        }

        const bubble = document.createElement('div');
        bubble.className = 'speech-bubble';
        bubble.textContent = text;
        target.element.appendChild(bubble);

        // 6秒后移除（CSS 动画在5.5秒时淡出）
        setTimeout(() => bubble.remove(), 6000);
      }

      schedulePetSpeak();
    }

    // 安排下一次说话：60-180秒后
    function schedulePetSpeak() {
      const delay = (60 + Math.random() * 120) * 1000;
      setTimeout(petSpeak, delay);
    }

    // 启动定时问候（首次1-3分钟后）
    schedulePetSpeak();
  </script>
</body>
</html>
